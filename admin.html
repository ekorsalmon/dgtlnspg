<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D1377">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DGTLN POS">
<title>DGTLN POS — Admin</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2D1377;--panel:#4421A6;--field:#36178C;--line:rgba(255,255,255,.13);--txt:#fff;--mut:#BFAEF5;--lime:#D7F26A;--pink:#FF4F6E;--lav:#B79CFF;--ink:#20104F;--yel:#D7F26A;--mint:#D7F26A;--blue:#B79CFF;--pur:#B79CFF;--org:#FF9F5A;--r:26px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent;font-size:15px}
#app{max-width:480px;margin:0 auto;padding:18px 16px 48px;min-height:100vh}
@media(min-width:560px){html,body{background:#A98CF5}#app{background:var(--bg);border-radius:40px;margin:24px auto;min-height:calc(100vh - 48px);padding:22px 20px 48px}}
h1,h2,h3,.num,.fd{font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:36px;line-height:1}h2{font-size:24px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.hl{color:var(--lime)}
[data-tone] .mut,[data-tone] .sm{color:inherit;opacity:.75}
.card{background:var(--panel);border-radius:var(--r);padding:16px;position:relative}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:15px 18px;background:var(--field);cursor:pointer;color:var(--txt);transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97);filter:brightness(1.08)}
.btn.block{width:100%;display:block}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.primary{background:var(--lime);color:var(--ink)}
.btn.danger{background:rgba(255,79,110,.18);color:#FF9FB1}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--lime)}
[data-tone=lime]{background:var(--lime)!important;color:var(--ink)!important}
[data-tone=pink]{background:var(--pink)!important;color:#fff!important}
[data-tone=lav]{background:var(--lav)!important;color:var(--ink)!important}
.sec{font-size:18px;margin:24px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero{display:flex;gap:16px;align-items:center;margin:20px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.role{text-align:center;font-size:16px;padding:22px 10px;border-radius:var(--r)}.role .big{font-size:36px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:13.5px;border:1.5px solid var(--lav);border-radius:999px;padding:8px 14px;background:transparent;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.scroll .chip{flex:none}
.evc{text-align:left;margin-bottom:10px;display:flex!important;flex-direction:column;gap:3px;border-radius:22px;background:var(--panel);padding:16px 18px}
.evc .mut{font-weight:500;font-size:13px}
.note{font-size:12px;color:var(--mut);margin-top:12px;text-align:center}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ava{width:48px;height:48px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--lav)}
.callc{background:var(--lime);color:var(--ink);padding:20px;overflow:hidden}
.callc::after{content:'';position:absolute;right:-18px;top:-18px;width:120px;height:120px;background:var(--lav);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.callc>*{position:relative;z-index:1}
.lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.7}
.num{font-size:28px;line-height:1.1}.num.xl{font-size:68px;line-height:1}.num.md{font-size:20px}
.num small{font-size:13px;font-family:'Plus Jakarta Sans',sans-serif}
.bar{height:10px;border-radius:99px;background:rgba(32,16,79,.14);margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.mini{padding:14px}.act{margin-top:12px}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:18px;padding:20px 8px;border-radius:var(--r);background:var(--panel)}
.bigbtn .em{font-size:30px}.bigbtn small{font-size:12px;font-weight:600;opacity:.75}
.th{border-radius:16px;display:grid;place-items:center;flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stki{padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0;border-radius:22px}
.stki.low{box-shadow:inset 0 0 0 2px var(--pink)}
.stki .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{padding:4px 16px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:last-child{border-bottom:0}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;background:rgba(255,255,255,.14);color:var(--txt);display:inline-block}
.tag.Tunai,.tag.Berlangsung{background:var(--lime);color:var(--ink)}
.tag.QRIS,.tag.Akan{background:var(--lav);color:var(--ink)}
.tag.Gratis,.tag.Merch{background:var(--pink);color:#fff}
.tag.Produk{background:#fff;color:var(--ink)}.tag.Bundling{background:var(--org);color:var(--ink)}
.tag.off,.tag.Selesai,.tag.Nonaktif{background:rgba(255,255,255,.1);color:var(--mut)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--panel);border-radius:26px;padding:6px;margin-bottom:18px}
.tabs button{font:inherit;font-weight:700;font-size:11.5px;border:0;border-radius:20px;padding:8px 2px;background:none;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:18px}
.tabs button.on{background:var(--lime);color:var(--ink)}
#sheet{position:fixed;inset:0;background:rgba(20,8,60,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet.open{display:flex}
#sin{background:var(--bg);width:100%;max-width:480px;max-height:93vh;overflow:auto;border-radius:32px 32px 0 0;padding:20px 16px 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.x{font:inherit;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);cursor:pointer;font-weight:700;flex:none;color:var(--txt)}
.step{display:flex;align-items:center;gap:10px;font-family:'Outfit',sans-serif;font-weight:600;font-size:18px;margin:20px 0 10px}
.step span{width:28px;height:28px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:14px}
.prod{margin-bottom:10px;padding:12px;border-radius:24px}
.ph{display:flex;align-items:center;gap:12px}
.vr{display:flex;align-items:center;justify-content:space-between;padding:9px 0 0;margin-top:9px;border-top:1px solid var(--line)}
.vr em{font-style:normal;color:var(--mut);font-size:12px;font-weight:500;margin-left:6px}
.stp{display:flex;align-items:center;gap:10px;flex:none}
.stp button{width:36px;height:36px;border-radius:50%;border:0;background:var(--field);font-size:19px;font-weight:700;cursor:pointer;color:var(--txt)}
.stp button:last-child{background:var(--lime);color:var(--ink)}
.stp b{min-width:14px;text-align:center;font-family:'Outfit',sans-serif;font-size:19px}
.form label{display:block;font-weight:600;font-size:12px;margin:16px 0 7px;color:var(--mut)}
.form>label:first-child{margin-top:0}
.form label.up{display:inline-block;margin:0;color:var(--txt)}
.req{color:var(--pink)}
.opt{color:var(--mut);font-weight:500;opacity:.8}
input[type=date],input[type=time]{font:inherit;width:100%;border:1.5px solid transparent;border-radius:18px;padding:11px 12px;background:var(--field);font-size:15px;color:var(--txt);min-height:50px;color-scheme:dark}
input[type=number],input[type=tel],input[type=text],input[type=password],input[type=email],textarea{font:inherit;width:100%;border:1.5px solid transparent;border-radius:18px;padding:13px 16px;background:var(--field);font-size:16px;color:var(--txt);outline:none}
input:focus,textarea:focus{border-color:var(--lime)}
::placeholder{color:var(--mut);opacity:.7}
textarea{resize:vertical}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg.s3{grid-template-columns:1fr 1fr 1fr}
.seg button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 6px;background:var(--field);cursor:pointer;color:var(--txt)}
.seg button.on{background:var(--lime);color:var(--ink)}
.tglr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-weight:700;font-size:14px}
.tglr small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.tgl{width:52px;height:30px;border-radius:99px;background:var(--field);position:relative;cursor:pointer;flex:none}
.tgl::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.15s}
.tgl.on{background:var(--lime)}.tgl.on::after{left:26px;background:var(--ink)}
.dots{display:flex;gap:10px;margin-top:12px}
.dot{width:30px;height:30px;border-radius:50%;cursor:pointer}
.dot.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px #fff}
.emo{font-size:20px;padding:6px 10px}
.evcard{margin-bottom:12px}
.evm{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:18px}
.brief{background:rgba(215,242,106,.1);border:1.5px dashed var(--lime);border-radius:20px;padding:14px;font-size:14px;line-height:1.55;margin-top:12px}
.kemb{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:13px 16px;border-radius:18px;background:var(--lime);color:var(--ink);font-weight:700}
.kemb.neg{background:var(--pink);color:#fff}
.qr{text-align:center}.qr svg{width:170px;height:170px;margin:4px auto 12px;display:block;border-radius:18px}
.chk{display:flex!important;align-items:center;gap:10px;justify-content:center;margin-top:14px!important;font-size:14px!important;color:var(--txt)!important}
.chk input{width:22px;height:22px;accent-color:var(--lime)}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0 18px;border-top:1px solid var(--line);margin-top:18px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tot b{font-family:'Outfit',sans-serif;font-size:30px}
.pb{padding-bottom:22px}
.struk{background:#fff;color:var(--ink);border-radius:22px;padding:18px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.struk .c{text-align:center;line-height:1.5}
.struk hr{border:0;border-top:1.5px dashed #b9b0d6;margin:10px 0}
.struk .l{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
.struk .b{font-weight:800;font-size:15px}
.hero-img{height:200px;border-radius:28px;display:grid;place-items:center;font-size:88px;overflow:hidden;margin-bottom:14px}
.hero-img img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.kv b{text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:right;padding:6px 4px;font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:10px 4px;border-top:1px solid var(--line);font-weight:600;vertical-align:top}
.tbl td small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.tbl input{width:74px;padding:8px 10px;font-size:15px;text-align:right;border-radius:12px}
.hb{margin:10px 0}
.hb .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.hb .tr{height:10px;border-radius:99px;background:var(--field);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140px);background:var(--lime);color:var(--ink);padding:13px 20px;border-radius:999px;font-weight:700;transition:transform .25s;z-index:99;max-width:90vw;text-align:center;font-size:14px;box-shadow:0 10px 30px rgba(20,8,60,.4)}
#toast.show{transform:translate(-50%,0)}
.net{display:flex;align-items:center;gap:8px;width:100%;border:0;font:inherit;font-weight:700;font-size:12.5px;border-radius:999px;padding:9px 14px;margin:-4px 0 12px;cursor:pointer;background:var(--panel);color:var(--txt)}
.net i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(215,242,106,.2)}
.net.off{background:rgba(255,79,110,.16);color:#FFB3C1}.net.off i{background:var(--pink);box-shadow:0 0 0 4px rgba(255,79,110,.25)}
.net span{margin-left:auto;opacity:.6;font-weight:600}
.pts{display:flex;flex-direction:column;gap:10px;margin-top:6px}.pts div{display:flex;gap:10px;font-size:14px;line-height:1.5}.pts b{flex:none}
.demo{display:inline-block;font-size:10.5px;font-weight:800;background:var(--lime);color:var(--ink);padding:4px 10px;border-radius:99px;letter-spacing:.06em}

code{background:var(--field);padding:2px 6px;border-radius:6px;font-size:12px}
body{padding-top:env(safe-area-inset-top)}

.bounce{animation:bnc 1.2s ease-in-out infinite}@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
a.btn{display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sin"></div></div>
<div id="toast"></div>
<script>window.DGTLN_APP = 'admin';</script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
